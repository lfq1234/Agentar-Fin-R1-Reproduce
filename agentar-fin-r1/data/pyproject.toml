[project]
name = "finr1-data"
version = "0.1.0"
description = "Data reproduction pipeline for Agentar-Fin-R1 (three-level governance)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "datasets>=2.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finr1_data"]
