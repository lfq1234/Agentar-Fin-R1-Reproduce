[project]
name = "finr1-training"
version = "0.1.0"
description = "Training reproduction for Agentar-Fin-R1 (weighted SFT + GRPO + attribution loop)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "peft>=0.10",
    "datasets>=2.20",
    "pydantic>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finr1_training"]
