[project]
name = "finr1-training"
version = "0.1.0"
description = "Training reproduction for Agentar-Fin-R1 (peft+lora SFT + verl+lora GRPO)"
requires-python = ">=3.10"
dependencies = [
    # Stage 1 — peft + LoRA SFT
    "torch>=2.2",
    "transformers>=4.40",
    "peft>=0.10",
    "datasets>=2.20",
    "trl>=0.12",
    "accelerate>=0.30",
    "bitsandbytes>=0.43",
    # Stage 2 — verl + LoRA GRPO
    "verl>=0.3",
    "vllm>=0.6",
    # reward / data
    "pandas>=2.0",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "hydra-core>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model", "sft", "grpo"]
