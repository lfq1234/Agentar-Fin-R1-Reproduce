[project]
name = "finr1-training"
version = "0.1.0"
description = "Two-stage (SFT + GRPO) training reproduction for Agentar-Fin-R1"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "transformers>=4.45",
    "datasets>=2.20",
    "accelerate>=0.34",
    "peft>=0.12",
    "trl>=0.16",   # GRPO：num_generations 命名 + reward 函数接收数据集其余列（reward_kwargs）
    "flash-attn>=2.6",
    "sentencepiece",
    "huggingface_hub>=0.25",
    "openai>=1.30",   # GRPO 裁判模型客户端（OpenAI 兼容 /v1，接 vLLM 或商业 API）
    "wandb",
]
# 精度约定：基座统一 FP16 加载 + 训练 fp16=True(AMP)；不引入 bitsandbytes/QLoRA/4bit。

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finr1_training"]
