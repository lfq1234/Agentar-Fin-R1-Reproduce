[project]
name = "finr1-training"
version = "0.1.0"
description = "Two-stage (SFT + GRPO) training reproduction for Agentar-Fin-R1"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "ms-swift>=3.0",   # 训练框架：SFT / GRPO（rlhf_type=grpo）统一由 swift 驱动，不手搓训练循环
    "transformers>=4.45",
    "datasets>=2.20",
    "flash-attn>=2.6",
    "sentencepiece",
    "huggingface_hub>=0.25",
    "openai>=1.30",   # GRPO 裁判模型客户端（OpenAI 兼容 /v1，接 vLLM 或商业 API）
    "wandb",
]
# 精度约定：基座统一 FP16 加载（torch_dtype=float16）+ 训练 AMP；不引入 bitsandbytes/QLoRA/4bit。
# 框架说明：SFT = swift sft（SwiftSftArguments），GRPO = swift rlhf --rlhf_type grpo（RLHFArguments），
#           LoRA merge = swift export（SwiftExportArguments）。

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finr1_training"]
