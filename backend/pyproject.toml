[project]
name = "backend"
version = "0.1.0"
description = "FastAPI service + agent runtime for Agentar-Fin-R1 reproduction"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "openai>=1.0",        # 01-模型接口：generate() 直连 OpenAI 兼容端点（含 vLLM /v1）
    "pyyaml>=6.0",        # 01-模型接口：app/config 加载 YAML 配置
    "agentscope==0.1.6",  # 02-多智能体：AgentScope 经典版（含 ReActAgent/DialogAgent/ServiceToolkit）
    "sqlmodel>=0.0.16",   # 03-传统后端基础层：ORM + Pydantic 统一（兼容 Pydantic v2）
    "aiosqlite>=0.19",
    "duckdb>=1.1.0",    # 06-知识库：DuckDB 向量存储（list_cosine_distance 需 >=1.1）    # 03-传统后端基础层：异步 SQLite 驱动（sqlite+aiosqlite://）
    "python-multipart>=0.0.9",  # 08-个人文档：/v1/documents 走 multipart 上传（UploadFile/Form）
    "pwdlib[argon2,bcrypt]>=0.4",  # 09-用户系统：密码哈希（Argon2/Bcrypt）
    "PyJWT>=2.8",                 # 09-用户系统：HS256 Bearer 令牌
]

[tool.uv]
package = false
