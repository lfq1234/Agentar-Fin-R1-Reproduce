[project]
name = "backend"
version = "0.1.0"
description = "FastAPI service + agent runtime for Agentar-Fin-R1 reproduction"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "openai>=1.0",        # 01-模型接口：generate() 直连 OpenAI 兼容端点（含 vLLM /v1）
    "pyyaml>=6.0",        # 01-模型接口：app/config 加载 YAML 配置
]

[tool.uv]
package = false
