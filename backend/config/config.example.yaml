# 脱敏模板：复制为 config.yaml 后按需填写，并在 .env 中提供真实密钥
# cp config.example.yaml config.yaml
model:
  mode: api                  # api | local
  timeout: 120
  max_retries: 2
  api:
    model_type: openai_chat
    model_name: gpt-4o
    api_key: ${OPENAI_API_KEY}
    base_url: https://api.openai.com/v1
    temperature: 0.3
    stream: false
  local:
    model_type: openai_chat
    model_name: qwen3-8b-finr1
    api_key: EMPTY
    base_url: http://localhost:8000/v1
    temperature: 0.3
    stream: false
    # local 内部两种加载方式（loader）：
    #   vllm        -> 连外部 vLLM/OpenAI 兼容端点（默认；需先起本地推理服务，如 tools/qwen_server.py）
    #   transformers-> 后端进程内直接用 transformers 加载权重（不依赖外部服务；需 torch+transformers 运行时）
    loader: vllm
    # 进程内直载（loader=transformers）时的权重目录；为空则回退 env MODEL_PATH，再回退 D:/models/Qwen3-0.6B
    model_path: ""

# 嵌入模型配置（01 为 04 的 RAG 向量化扩展；api/local 双模式，与 model 段平行）
emb:
  mode: api                  # api | local
  timeout: 120
  max_retries: 2
  api:
    model_type: openai_embedding
    model_name: text-embedding-3-small
    api_key: ${OPENAI_API_KEY}
    base_url: https://api.openai.com/v1
  local:
    model_type: openai_embedding
    model_name: bge-small-zh
    api_key: EMPTY
    base_url: http://localhost:8001/v1

# —— 03-传统后端基础层：数据库配置（复制为 config.yaml 后按需填写） ——
db:
  enabled: false             # true 时启用持久化；false 时系统无库也能启动并响应
  type: sqlite               # 仅 SQLite 后端
  sqlite_path: ./agentar.db  # SQLite 库文件路径（相对 backend/ 运行目录）
  echo: false                # SQLAlchemy echo（调试用）

# —— 03-传统后端基础层：服务配置 ——
server:
  host: 0.0.0.0
  port: 8000
  cors:
    origins:
      - "*"
    methods:
      - "*"
    headers:
      - "*"
