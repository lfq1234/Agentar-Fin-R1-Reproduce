# 脱敏模板：复制为 config.yaml 后按需填写，并在 .env 中提供真实密钥
# cp config.example.yaml config.yaml
model:
  mode: api                  # api | local
  timeout: 120
  max_retries: 2
  api:
    model_type: openai_chat
    model_name: gpt-4o
    api_key: ${OPENAI_API_KEY}
    base_url: https://api.openai.com/v1
    temperature: 0.3
    stream: false
  local:
    model_type: openai_chat
    model_name: qwen3-8b-finr1
    api_key: EMPTY
    base_url: http://localhost:8000/v1
    temperature: 0.3
    stream: false
    # local 模式统一为进程内 transformers 直载：
    # 权重目录；为空则回退 env MODEL_PATH，再回退 D:/models/Qwen3-0.6B（需 torch+transformers 运行时）
    model_path: ""

# 嵌入模型配置（01 为 04 的 RAG 向量化扩展；api/local 双模式，与 model 段平行）
emb:
  mode: api                  # api | local
  timeout: 120
  max_retries: 2
  api:
    model_type: openai_embedding
    model_name: text-embedding-3-small
    api_key: ${OPENAI_API_KEY}
    base_url: https://api.openai.com/v1
  local:
    model_type: openai_embedding
    model_name: bge-small-zh
    api_key: EMPTY
    base_url: http://localhost:8001/v1

# —— 03-传统后端基础层：数据库配置（复制为 config.yaml 后按需填写） ——
db:
  enabled: false             # true 时启用持久化；false 时系统无库也能启动并响应
  type: sqlite               # 仅 SQLite 后端
  sqlite_path: ./agentar.db  # SQLite 库文件路径（相对 backend/ 运行目录）
  echo: false                # SQLAlchemy echo（调试用）

# —— 09-用户系统与数据隔离：鉴权配置 ——
# secret_key 经 ${AUTH_SECRET_KEY} 从环境变量注入（backend/.env），禁止明文入库；
# 缺失即启动失败（需求 S3，lifespan eager 校验）。
security:
  secret_key: ${AUTH_SECRET_KEY}
  access_token_expire_minutes: 1440   # 令牌有效期（默认 24h）

# —— 03-传统后端基础层：服务配置 ——
server:
  host: 0.0.0.0
  port: 8000
  cors:
    origins:
      - "*"
    methods:
      - "*"
    headers:
      - "*"

# —— 06-知识库（DuckDB 向量检索 + SQLite 主库存储）（复制为 config.yaml 后按需填写） ——
kb:
  engine: duckdb              # duckdb（默认：SQLite 主库存储 + DuckDB 向量检索）| sqlite（纯 SQLite 回落）
  path: ./agentar.db          # 收口到 03 主库（08 评审 B1）；留空则自动取 db.sqlite_path
  corpus_dir: ./kb            # 语料源目录（.md/.txt/.html），与库文件解耦
  embed_dim: 0                # 0=自适应（取首个 embedding 维度）；非 0 固定
  use_vss: false              # 挂载的 SQLite 表无法建 DuckDB 原生 HNSW，保留占位（走精确扫描）
  build_on_startup: false     # lifespan 阶段是否自动构建 kb/（默认手动 build 脚本）
  chunk:
    max_chars: 600
    overlap: 80
  local_embed:
    enabled: false            # true 时启用进程内嵌入直载（不依赖外部嵌入服务）
    model_path: ${LOCAL_EMBED_MODEL_PATH}   # 本地嵌入模型目录，由环境变量/本地 secret 注入，不入库

# —— 08-个人文档与知识图谱后端（服务前端 03 双标签面板） ——
# 结构化表与向量表全部落 db.sqlite_path 主库，不另开文件。
personal_docs:
  enabled: true
  max_file_mb: 10             # 单文件大小上限，超限记 status=error（不抛 500）
  chunk:
    max_chars: 600
    overlap: 80
  graph:
    enabled: true
    model: none               # auto=走 01 get_model() 抽取；none=仅启发式，永不阻塞
  rag:
    enabled: true             # 是否允许个人文档参与 04 RAG 检索
    top_k: 3
  embed_dim: 0                # 0=自适应（首个向量定维）
