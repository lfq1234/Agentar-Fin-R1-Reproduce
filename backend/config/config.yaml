# 模型接口配置（评审问题1 修复：顶层 timeout/max_retries 为全局默认，由工厂合并进子段）
# 密钥不落库：以 ${ENV_VAR} 引用，加载时从环境变量替换（见 app/config/__init__.py）
model:
  mode: api                  # api | local
  timeout: 120               # 全局默认，工厂合并进所选子段（api/local）
  max_retries: 2
  api:
    model_type: openai_chat
    model_name: gpt-4o
    api_key: ${OPENAI_API_KEY}
    base_url: https://api.openai.com/v1
    temperature: 0.3
    stream: false
  local:
    model_type: openai_chat
    model_name: qwen3-8b-finr1
    api_key: EMPTY           # 本地 vLLM 不校验密钥，占位即可
    base_url: http://localhost:8000/v1
    temperature: 0.3
    stream: false

# —— 03-传统后端基础层：数据库配置 ——
db:
  enabled: false             # true 时启用持久化；false 时系统无库也能启动并响应
  type: sqlite               # sqlite | postgresql
  sqlite_path: ./agentar.db  # type=sqlite 时的库文件路径（相对 backend/ 运行目录）
  # type=postgresql 时启用下方 URL（不落库密钥，可用 ${ENV_VAR} 引用）：
  # postgres_url: postgresql+psycopg://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/${PG_DB}
  echo: false                # SQLAlchemy echo（调试用）

# —— 03-传统后端基础层：服务配置 ——
server:
  host: 0.0.0.0
  port: 8000
  cors:
    origins:
      - "*"
    methods:
      - "*"
    headers:
      - "*"
