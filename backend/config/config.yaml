# 联调用配置（本地 qwen3-0.6b，local 模式 + SQLite 落库）
# 由 config.example.yaml 复制并填充；区别于 api 模式（需 OPENAI_API_KEY）。
model:
  mode: local                  # 联调：本地模式（local 内部两种加载方式，见 config.local.loader）
  timeout: 180
  max_retries: 1
  api:
    model_type: openai_chat
    model_name: gpt-4o
    api_key: ${OPENAI_API_KEY}
    base_url: https://api.openai.com/v1
    temperature: 0.3
    stream: false
  local:
    model_type: openai_chat
    model_name: qwen3-0.6b
    api_key: EMPTY
    base_url: http://localhost:9000/v1   # 仅 transformers 直载外的兜底/导出用；直载模式不发起请求
    temperature: 0.3
    stream: false
    # —— local 内部两种加载方式（联调补充）——
    # loader: vllm        -> 连外部 OpenAI 兼容端点（默认，零额外依赖，需先起 tools/qwen_server.py）
    # loader: transformers-> 后端进程内直接用 transformers 加载权重（不依赖外部服务；需 torch 运行时）
    loader: transformers
    model_path: D:/models/Qwen3-0.6B     # 进程内直载的权重目录（可改用 env MODEL_PATH 覆盖）

# 嵌入模型配置：当前 run() 的 RAG 为占位实现，不调用 get_embedder()，
# 故 emb 段仅保留合法 schema 占位（local 指向模型服务，实际不会被请求）。
emb:
  mode: local
  timeout: 120
  max_retries: 2
  api:
    model_type: openai_embedding
    model_name: text-embedding-3-small
    api_key: ${OPENAI_API_KEY}
    base_url: https://api.openai.com/v1
  local:
    model_type: openai_embedding
    model_name: qwen3-0.6b
    api_key: EMPTY
    base_url: http://localhost:9000/v1

# —— 03-传统后端基础层：数据库配置（联调启用落库） ——
db:
  enabled: true                # 联调：启用持久化以验证续聊/落库
  type: sqlite
  sqlite_path: ./agentar.db
  echo: false

# —— 03-传统后端基础层：服务配置 ——
server:
  host: 0.0.0.0
  port: 8000
  cors:
    origins:
      - "*"
    methods:
      - "*"
    headers:
      - "*"
