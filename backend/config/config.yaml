# 联调用配置（本地 qwen3-0.6b，local 模式 + SQLite 落库）
# 由 config.example.yaml 复制并填充；区别于 api 模式（需 OPENAI_API_KEY）。
model:
  mode: local                  # 联调：本地模式（进程内 transformers 直载，仅依赖本地权重）
  timeout: 180
  max_retries: 1
  api:
    model_type: openai_chat
    model_name: gpt-4o
    api_key: ${OPENAI_API_KEY}
    base_url: https://api.openai.com/v1
    temperature: 0.3
    stream: false
  local:
    model_type: openai_chat
    model_name: qwen3-0.6b
    api_key: EMPTY
    base_url: http://localhost:9000/v1   # 仅作 agentscope 配置导出占位；进程内直载不发起网络请求
    temperature: 0.3
    stream: false
    model_path: D:/models/Qwen3-0.6B     # 进程内直载的权重目录（可改用 env MODEL_PATH 覆盖）

# 嵌入模型配置：当前 run() 的 RAG 为占位实现，不调用 get_embedder()，
# 故 emb 段仅保留合法 schema 占位（local 指向模型服务，实际不会被请求）。
emb:
  mode: local
  timeout: 120
  max_retries: 2
  api:
    model_type: openai_embedding
    model_name: text-embedding-3-small
    api_key: ${OPENAI_API_KEY}
    base_url: https://api.openai.com/v1
  local:
    model_type: openai_embedding
    model_name: qwen3-0.6b
    api_key: EMPTY
    base_url: http://localhost:9000/v1

# —— 03-传统后端基础层：数据库配置（联调启用落库） ——
db:
  enabled: true                # 联调：启用持久化以验证续聊/落库
  type: sqlite
  sqlite_path: ./agentar.db
  echo: false

# —— 03-传统后端基础层：服务配置 ——
server:
  host: 0.0.0.0
  port: 8000
  cors:
    origins:
      - "*"
    methods:
      - "*"
    headers:
      - "*"

# —— 06-知识库（DuckDB 向量检索 + SQLite 文件存储） ——
kb:
  engine: duckdb              # duckdb（默认：SQLite 文件存储 + DuckDB 向量检索）| sqlite（纯 SQLite 回落）
  path: ./kb/knowledge.db     # 知识库 SQLite 文件（文档/块/向量均落此文件；DuckDB 挂载它做向量检索）
  embed_dim: 0                # 0=自适应（取首个 embedding 维度）；非 0 固定
  use_vss: false              # 挂载的 SQLite 表无法建 DuckDB 原生 HNSW，保留占位（走精确扫描）
  build_on_startup: false     # lifespan 阶段是否自动构建 kb/（默认手动 build 脚本）
  chunk:
    max_chars: 600
    overlap: 80
  local_embed:
    enabled: false            # true 时启用进程内嵌入直载（不依赖外部嵌入服务）
    model_path: ${LOCAL_EMBED_MODEL_PATH}   # 本地嵌入模型目录，由环境变量/本地 secret 注入，不入库
