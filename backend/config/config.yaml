# 联调用配置（本地 qwen3-0.6b，local 模式 + SQLite 落库）
# 由 config.example.yaml 复制并填充；区别于 api 模式（需 OPENAI_API_KEY）。
model:
  mode: local                  # 联调：本地模式（进程内 transformers 直载，仅依赖本地权重）
  timeout: 180
  max_retries: 1
  api:
    model_type: openai_chat
    model_name: gpt-4o
    api_key: ${OPENAI_API_KEY}
    base_url: https://api.openai.com/v1
    temperature: 0.3
    stream: false
  local:
    model_type: openai_chat
    model_name: qwen3-0.6b
    api_key: EMPTY
    base_url: http://localhost:9000/v1   # 仅作 agentscope 配置导出占位；进程内直载不发起网络请求
    temperature: 0.3
    stream: false
    model_path: D:/models/Qwen3-0.6B     # 进程内直载的权重目录（可改用 env MODEL_PATH 覆盖）

# 嵌入模型配置：当前 run() 的 RAG 为占位实现，不调用 get_embedder()，
# 故 emb 段仅保留合法 schema 占位（local 指向模型服务，实际不会被请求）。
emb:
  mode: local
  timeout: 120
  max_retries: 2
  api:
    model_type: openai_embedding
    model_name: text-embedding-3-small
    api_key: ${OPENAI_API_KEY}
    base_url: https://api.openai.com/v1
  local:
    model_type: openai_embedding
    model_name: qwen3-0.6b
    api_key: EMPTY
    base_url: http://localhost:9000/v1

# —— 03-传统后端基础层：数据库配置（联调启用落库） ——
db:
  enabled: true                # 联调：启用持久化以验证续聊/落库
  type: sqlite
  sqlite_path: ./agentar.db
  echo: false

# —— 09-用户系统与数据隔离：鉴权配置 ——
# secret_key 经 ${AUTH_SECRET_KEY} 从环境变量注入（backend/.env），禁止明文入库；
# 缺失即启动失败（需求 S3，lifespan eager 校验）。
security:
  secret_key: ${AUTH_SECRET_KEY}
  access_token_expire_minutes: 1440   # 令牌有效期（默认 24h）

# —— 07-会话历史记录（Session History & Trace） ——
# 复用 03 主库（db.sqlite_path 指定的 agentar.db），不另开文件；
# 作为 service 层（落库/查询/检索/导出）+ view 层（跨表聚合），旁路异步写入，失败不阻塞主链路。
history:
  enabled: true                 # 总开关；false 时返回 NoopHistoryStore（主链路不阻塞）
  # db_path: 可选覆盖主库路径；不配则复用 03 的 db.sqlite_path（agentar.db）
  record_traces: true           # 是否记录细粒度 trace_events（关则仅记 session_traces 头）
  async_write: true             # 旁路异步写入（不阻塞 run() 返回）
  fail_mode: silent             # silent（失败静默+告警日志）| local（落本地兜底 JSONL 文件）
  retention_days: 180           # 留存期；purge_before 清理更早轨迹（0=永久）
  purge_cascade: false          # delete_session/purge_before 是否联动清 03 主消息（谨慎）
  pii_redact: true              # 落库前脱敏（手机号/身份证/银行卡/邮箱掩码）
  semantic_search: false        # 可选语义检索（开启依赖 06 get_embedder() + 维度一致）
  allow_admin_all: false        # 管理员跨用户审计开关
  admin_user_ids: []            # 管理员身份来源（评审 B3）：03 User 表无 role 字段，
                                #   故以 user_id 白名单判定管理员，避免改动 03 schema
  build_on_startup: true        # 启动时幂等建表（评审 B6：与 03 init_db 同模式，不依赖迁移脚本）

# —— 03-传统后端基础层：服务配置 ——
server:
  host: 0.0.0.0
  port: 8000
  cors:
    origins:
      - "*"
    methods:
      - "*"
    headers:
      - "*"

# —— 06-知识库（DuckDB 向量检索 + SQLite 主库存储） ——
# 08 评审 B1：知识库不再另开 kb/knowledge.db，chunks/kb_meta 直接落 03 主库
# （db.sqlite_path 指定的 agentar.db），与 08 个人文档共用同一条 DuckDB 挂载连接，
# 使「公共知识库 + 个人文档」可在一次检索内联合召回。
kb:
  engine: duckdb              # duckdb（默认：SQLite 主库存储 + DuckDB 向量检索）| sqlite（纯 SQLite 回落）
  path: ./agentar.db          # 收口到 03 主库；留空则自动取 db.sqlite_path
  corpus_dir: ./kb            # 语料源目录（.md/.txt/.html），与库文件解耦；build 脚本扫描此目录
  embed_dim: 0                # 0=自适应（取首个 embedding 维度）；非 0 固定
  use_vss: false              # 挂载的 SQLite 表无法建 DuckDB 原生 HNSW，保留占位（走精确扫描）
  build_on_startup: false     # lifespan 阶段是否自动构建 kb/（默认手动 build 脚本）
  chunk:
    max_chars: 600
    overlap: 80
  local_embed:
    enabled: false            # true 时启用进程内嵌入直载（不依赖外部嵌入服务）
    model_path: ${LOCAL_EMBED_MODEL_PATH}   # 本地嵌入模型目录，由环境变量/本地 secret 注入，不入库

# —— 08-个人文档与知识图谱后端（服务前端 03 双标签面板） ——
# 结构化表（personal_documents / personal_doc_chunks / personal_graph_*）与向量表
# personal_doc_chunk_embeddings 全部落 db.sqlite_path 主库，不另开文件。
personal_docs:
  enabled: true
  max_file_mb: 20             # 单文件大小上限，超限记 status=error（不抛 500）
  chunk:
    max_chars: 600
    overlap: 80
  graph:
    enabled: true
    model: none               # auto=走 01 get_model() 抽取（需模型可用）；none=仅启发式，永不阻塞
  rag:
    enabled: true             # 是否允许个人文档参与 04 RAG 检索（评审 S4）
    top_k: 3                  # /v1/rag/retrieve 与 chat 检索的默认片段数
  embed_dim: 0                # 0=自适应（首个向量定维）
